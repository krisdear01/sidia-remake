worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json application/problem+json;
    server_tokens off;

    # Trust the reverse proxy / load balancer in front of us. Adjust
    # to your actual LB CIDR before going to production.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    upstream php { server 127.0.0.1:9000; }

    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        client_max_body_size 1m;
        access_log /dev/stdout;

        # Health endpoint is hit constantly by the LB; skip access log.
        location = /api/v1/health {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        location / {
            try_files $uri /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass php;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 10s;
            include fastcgi_params;
        }
    }
}
